name: CI

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

      - name: Validate agent package
        run: |
          node -e '
            const fs = require("node:fs");
            const root = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            const files = [
              "agents/package.json", "agents/plugin.json", "agents/gemini-extension.json",
              "agents/.claude-plugin/plugin.json", "agents/.claude-plugin/marketplace.json",
              "agents/.agents/plugins/marketplace.json", "agents/hooks/hooks.json",
            ];
            const versioned = new Set(files.slice(0, 4));
            for (const f of files) {
              const json = JSON.parse(fs.readFileSync(f, "utf8"));
              if (versioned.has(f) && json.version !== root) {
                console.error(`${f}: version ${json.version} != package.json ${root}`);
                process.exit(1);
              }
            }
          '
          sh -n agents/hooks/session-start.sh

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

  helm:
    name: Helm
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint Helm chart
        run: helm lint --strict charts/ok-fine --set config.publicBaseUrl=https://okf.example.com --set oauth.issuer=https://idp.example.com

  image:
    name: Build image (${{ matrix.arch }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (dry-run to warm cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
