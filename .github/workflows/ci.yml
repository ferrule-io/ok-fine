name: CI

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          cache: true

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint and format check
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Validate agent package
        run: |
          node -e '
            const fs = require("node:fs");
            const root = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            const files = [
              "agents/package.json", "agents/plugin.json", "agents/gemini-extension.json",
              "agents/.claude-plugin/plugin.json", "agents/.claude-plugin/marketplace.json",
              "agents/.agents/plugins/marketplace.json", "agents/hooks/hooks.json",
            ];
            const versioned = new Set(files.slice(0, 4));
            for (const f of files) {
              const json = JSON.parse(fs.readFileSync(f, "utf8"));
              if (versioned.has(f) && json.version !== root) {
                console.error(`${f}: version ${json.version} != package.json ${root}`);
                process.exit(1);
              }
            }
            // omp drops catalog entries whose string source does not start with "./".
            const catalog = JSON.parse(fs.readFileSync("agents/.claude-plugin/marketplace.json", "utf8"));
            for (const p of catalog.plugins) {
              if (typeof p.source === "string" && !p.source.startsWith("./")) {
                console.error(`marketplace.json: plugin ${p.name} source "${p.source}" must start with "./"`);
                process.exit(1);
              }
            }
          '
          sh -n agents/hooks/session-start.sh

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

  helm:
    name: Helm
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Lint Helm chart
        run: helm lint --strict charts/ok-fine --set config.publicBaseUrl=https://okf.example.com --set oauth.issuer=https://idp.example.com

  image:
    name: Build image (${{ matrix.arch }})
    # Release builds and pushes the real images on main; this dry-run only warms the cache on development.
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Docker image (dry-run to warm cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
