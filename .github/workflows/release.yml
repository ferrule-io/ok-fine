name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  plan:
    name: Plan release
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      created: ${{ steps.release.outputs.created }}
      is_latest: ${{ steps.release.outputs.is_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Create release commit and tag locally
        id: release
        env:
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          GITHUB_OUTPUT="${GITHUB_OUTPUT:-/dev/null}"
          GITHUB_STEP_SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"

          S="$(git rev-parse "$SOURCE_SHA")"

          found_tag=""
          found_commit=""
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            parent="$(git rev-parse --verify "${tag}^{commit}^1" 2>/dev/null || true)"
            if [ -n "$parent" ] && [ "$parent" = "$S" ]; then
              found_tag="$tag"
              found_commit="$(git rev-parse "${tag}^{commit}")"
              break
            fi
          done < <(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V -r || true)

          if [ -n "$found_tag" ]; then
            version="${found_tag#v}"
            sha="$found_commit"
            created="false"
          else
            origin_main="$(git rev-parse --verify origin/main 2>/dev/null || true)"
            if [ -z "$origin_main" ]; then
              echo "::error::Could not resolve origin/main"
              exit 1
            fi
            if [ "$origin_main" != "$S" ]; then
              echo "::error::main moved past ${SOURCE_SHA}; the newer push releases it"
              exit 1
            fi

            chart_version="$(git show "${SOURCE_SHA}:charts/ok-fine/Chart.yaml" | awk '/^version:/ {gsub(/["\047]/, "", $2); print $2; exit}')"
            latest_tag="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
            if [ -n "$latest_tag" ]; then
              tag_version="${latest_tag#v}"
              base_version="$(printf '%s\n%s\n' "$chart_version" "$tag_version" | sort -V | tail -n 1)"
            else
              base_version="$chart_version"
            fi

            if ! [[ "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Base version '$base_version' is invalid; expected semantic version matching ^[0-9]+\.[0-9]+\.[0-9]+$"
              exit 1
            fi

            IFS='.' read -r major minor patch <<< "$base_version"
            version="${major}.${minor}.$((patch + 1))"

            sed -i.bak -E "s/^version: .*/version: ${version}/; s/^appVersion: .*/appVersion: \"${version}\"/" charts/ok-fine/Chart.yaml && rm -f charts/ok-fine/Chart.yaml.bak
            sed -i.bak -E "s/\"version\": \"[^\"]+\"/\"version\": \"${version}\"/" package.json && rm -f package.json.bak
            sed -i.bak -E "s/export const VERSION = \"[^\"]+\";/export const VERSION = \"${version}\";/" src/version.ts && rm -f src/version.ts.bak
            agent_manifests=(agents/package.json agents/plugin.json agents/gemini-extension.json agents/.claude-plugin/plugin.json)
            for f in "${agent_manifests[@]}"; do
              sed -i.bak -E "s/\"version\": \"[^\"]+\"/\"version\": \"${version}\"/" "$f" && rm -f "$f.bak"
            done

            git add charts/ok-fine/Chart.yaml package.json src/version.ts "${agent_manifests[@]}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(release): v${version}"
            git tag -a "v${version}" -m "Release v${version}"

            # Images build from this exact commit; release-commit pushes it only after they succeed.
            mkdir -p "$RUNNER_TEMP/release"
            git bundle create "$RUNNER_TEMP/release/release.bundle" "refs/tags/v${version}" "^${S}"

            sha="$(git rev-parse HEAD)"
            created="true"
          fi

          highest_tag="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ "$highest_tag" = "v${version}" ]; then
            is_latest="true"
          else
            is_latest="false"
          fi

          {
            echo "version=${version}"
            echo "sha=${sha}"
            echo "created=${created}"
            echo "is_latest=${is_latest}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release v${version}"
            echo "- Commit: \`${sha}\`"
            echo "- Created: \`${created}\`"
            echo "- Latest: \`${is_latest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release bundle
        if: steps.release.outputs.created == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release/release.bundle
          retention-days: 1
          if-no-files-found: error

  image:
    name: Build image (${{ matrix.arch }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.created == 'true' && github.sha || needs.plan.outputs.sha }}

      - name: Download release bundle
        if: needs.plan.outputs.created == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release

      - name: Check out unpushed release commit
        if: needs.plan.outputs.created == 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch "$RUNNER_TEMP/release/release.bundle" "refs/tags/v${VERSION}:refs/tags/v${VERSION}"
          git checkout --detach "$RELEASE_SHA"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max

      - name: Export digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${DIGEST#sha256:}"
          touch "$RUNNER_TEMP/digests/$digest"

      - name: Upload digest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  release-commit:
    name: Release commit and tag
    needs: [plan, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        if: needs.plan.outputs.created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download release bundle
        if: needs.plan.outputs.created == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release

      - name: Push release commit and tag
        if: needs.plan.outputs.created == 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch "$RUNNER_TEMP/release/release.bundle" "refs/tags/v${VERSION}:refs/tags/v${VERSION}"
          if ! git push --atomic origin "${RELEASE_SHA}:refs/heads/main" "refs/tags/v${VERSION}"; then
            echo "::error::Could not push v${VERSION}; if main moved past ${GITHUB_SHA}, the newer push releases it"
            exit 1
          fi

  manifest:
    name: Create multi-arch manifest
    needs: [plan, release-commit]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMG: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
          IS_LATEST: ${{ needs.plan.outputs.is_latest }}
        run: |
          set -euo pipefail
          short_sha="${RELEASE_SHA:0:7}"
          tags=(
            "-t" "${IMG}:${VERSION}"
            "-t" "${IMG}:sha-${short_sha}"
          )
          if [ "$IS_LATEST" = "true" ]; then
            tags+=("-t" "${IMG}:latest")
          fi
          refs=()
          for d in *; do
            refs+=("${IMG}@sha256:${d}")
          done
          docker buildx imagetools create \
            "${tags[@]}" \
            "${refs[@]}"
          docker buildx imagetools inspect "${IMG}:${VERSION}"

  chart:
    name: Publish Helm chart
    needs: [plan, manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Publish Helm chart
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          helm package charts/ok-fine --destination "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/ok-fine-${VERSION}.tgz"
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$REGISTRY_USER" --password-stdin
          helm push "$RUNNER_TEMP/ok-fine-${VERSION}.tgz" "oci://ghcr.io/${REGISTRY_OWNER}/charts"

  agents:
    name: Publish agent package
    needs: [plan, release-commit]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          path: source

      - name: Checkout ok-fine-agents mirror
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/ok-fine-agents
          ref: main
          ssh-key: ${{ secrets.AGENTS_DEPLOY_KEY }}
          fetch-depth: 0
          path: mirror

      - name: Mirror agents/ and tag
        working-directory: mirror
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
          IS_LATEST: ${{ needs.plan.outputs.is_latest }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "v${VERSION} already published"
            exit 0
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a ../source/agents/. .
          cp ../source/LICENSE ./LICENSE
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Release v${VERSION} (ferrule-io/ok-fine@${RELEASE_SHA:0:7})"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          if [ "$IS_LATEST" = "true" ]; then
            git push origin HEAD:main "v${VERSION}"
          else
            git push origin "v${VERSION}"
          fi

  npm:
    name: Publish npm package
    needs: [plan, release-commit]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish to npm
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          IS_LATEST: ${{ needs.plan.outputs.is_latest }}
        shell: bash
        run: |
          set -euo pipefail
          if npm view "@ferrule-io/ok-fine@${VERSION}" version >/dev/null 2>&1; then
            echo "@ferrule-io/ok-fine@${VERSION} already published"
            exit 0
          fi
          tag="latest"
          if [ "$IS_LATEST" != "true" ]; then tag="previous"; fi
          npm publish --provenance --access public --tag "$tag"

  wiki:
    name: Publish wiki
    needs: [plan, release-commit]
    if: needs.plan.outputs.is_latest == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          path: source

      - name: Mirror wiki/ to the repository wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.wiki.git" wiki; then
            echo "::error::Cannot clone the ${REPOSITORY} wiki; save its first page at https://github.com/${REPOSITORY}/wiki once, then rerun this job"
            exit 1
          fi
          cd wiki
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a ../source/wiki/. .
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already matches v${VERSION}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release v${VERSION} (ferrule-io/ok-fine@${RELEASE_SHA:0:7})"
          git push origin HEAD

  merge-back:
    name: Merge release to development
    needs: [plan, manifest, chart]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Merge release into development
        id: merge-back
        env:
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin development main
          git checkout -B development --track origin/development

          if git merge-base --is-ancestor "$RELEASE_SHA" origin/development; then
            echo "Release commit $RELEASE_SHA is already an ancestor of origin/development. Nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git merge --no-edit -m "chore(release): merge v${VERSION} into development" "$RELEASE_SHA"; then
            conflict_files="$(git diff --name-only --diff-filter=U || true)"
            git merge --abort || true
            echo "::error::Merge conflict while merging release commit ${RELEASE_SHA} (v${VERSION}) into development: ${conflict_files}"
            exit 1
          fi

          git push origin HEAD:development
