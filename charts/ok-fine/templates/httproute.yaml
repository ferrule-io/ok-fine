{{- if .Values.httpRoute.enabled -}}
{{- if eq .Values.auth.mode "none" -}}
{{- fail "unauthenticated admin access must not be routed publicly; use kubectl port-forward" -}}
{{- end -}}
{{- if not .Values.httpRoute.parentRefs -}}
{{- fail "httpRoute.parentRefs is required when httpRoute.enabled is true" -}}
{{- end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ok-fine.fullname" . }}
  labels:
    {{- include "ok-fine.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    - {{ include "ok-fine.host" . | quote }}
  rules:
    - backendRefs:
        - name: {{ include "ok-fine.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
