{{- if .Values.ingress.enabled -}}
{{- if eq .Values.auth.mode "none" -}}
{{- fail "unauthenticated admin access must not be routed publicly; use kubectl port-forward" -}}
{{- end -}}
{{- $publicBaseUrl := include "ok-fine.publicBaseUrl" . -}}
{{- $tls := .Values.ingress.tls | default dict -}}
{{- if and (hasPrefix "https://" $publicBaseUrl) (not $tls.secretName) (not $tls.terminatedUpstream) -}}
{{- fail "ingress.tls.secretName is required when config.publicBaseUrl uses https://, unless ingress.tls.terminatedUpstream is true" -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ok-fine.fullname" . }}
  labels:
    {{- include "ok-fine.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if $tls.secretName }}
  tls:
    - hosts:
        - {{ include "ok-fine.host" . | quote }}
      secretName: {{ $tls.secretName }}
  {{- end }}
  rules:
    - host: {{ include "ok-fine.host" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ok-fine.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
