apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "ok-fine.fullname" . }}-test-connection"
  labels:
    {{- include "ok-fine.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.37
      command: ['wget']
      args: ['-qO-', 'http://{{ include "ok-fine.fullname" . }}:{{ .Values.service.port }}/healthz']
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
  restartPolicy: Never
