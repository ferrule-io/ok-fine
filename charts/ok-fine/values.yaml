image:
  repository: ghcr.io/ferrule-io/ok-fine
  tag: ""            # defaults to .Chart.AppVersion
  digest: ""         # wins over tag when set
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  name: ""
  annotations: {}
config:
  publicBaseUrl: ""  # REQUIRED, e.g. https://okf.example.com; MCP endpoint is <publicBaseUrl>/mcp
  logLevel: info
  maxFileBytes: 1048576
  maxArchiveBytes: 52428800
  defaultStaleAfterDays: null  # opt-in: stamps stale_after = now + N days on write_concept when omitted
  trustProxy: ""               # optional: boolean, integer hop count, or CIDR/keyword string (e.g. "loopback,linklocal,uniquelocal")
auth:
  mode: oidc         # oidc (default) validates JWTs from oauth.issuer; none disables authentication entirely — every request gets admin access; local testing only, unauthenticated admin access must not be routed publicly (ingress and httpRoute must be disabled; use kubectl port-forward)
oauth:               # used only when auth.mode=oidc
  issuer: ""         # REQUIRED; must equal the access token `iss` exactly
  audiences: []      # default ["<publicBaseUrl>/mcp"]
  jwksUri: ""        # default: discovered from the issuer
  scopes:
    read: okf:read
    write: okf:write
    admin: okf:admin
  identityClaims: [email, preferred_username, sub]
  allowInsecureIssuer: false   # development only (http:// issuer)
  allowedSubjects: []          # optional: restrict access to specific JWT sub claims
  allowedEmails: []            # optional: restrict access to specific verified email claims
  requiredGroups: []           # optional: restrict access to callers with these groups
  groupsClaim: ""              # optional: claim containing user groups (default: "groups")
  allowedClientIds: []         # optional: restrict access to specific OAuth client IDs (azp / client_id)
  uiClientId: ""   # public client for the web UI (auth code + PKCE, redirect <publicBaseUrl>/ui/callback); empty = dynamic client registration
git:
  branch: main
  remote:
    url: ""          # empty = history kept only on the PVC
    auth: none       # none | ssh | https
    existingSecret: ""
    sshPrivateKeyKey: ssh-privatekey
    knownHostsKey: known_hosts   # required when auth is ssh: secret key containing SSH known_hosts
    httpUsernameKey: username
    httpPasswordKey: password
    syncIntervalSeconds: 60
persistence:
  enabled: true      # false = emptyDir (data lost on restart unless a remote is configured)
  existingClaim: ""
  storageClass: ""   # "-" renders storageClassName: ""
  accessModes: [ReadWriteOnce]
  size: 5Gi
  annotations: {}
extraEnv: []
service:
  type: ClusterIP
  port: 80
  annotations: {}
ingress:
  enabled: false
  className: ""
  annotations: {}
  tls:
    secretName: ""
    terminatedUpstream: false  # set true if TLS is terminated upstream (e.g. cloud load balancer or edge proxy)
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
networkPolicy:
  enabled: false
  ingressFrom: []
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
terminationGracePeriodSeconds: 30
nodeSelector: {}
tolerations: []
affinity: {}
