# Local testing only; authentication disabled, every caller gets admin access.
# For real deployments, use the Helm chart with OIDC.

services:
  ok-fine:
    image: ghcr.io/ferrule-io/ok-fine:latest
    # Builds from this checkout when the image is not available locally.
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AUTH_MODE: "none"
      PUBLIC_BASE_URL: "http://localhost:8080"
    volumes:
      - okf-data:/data

volumes:
  okf-data:
